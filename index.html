<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music Notes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Music Notes</title>
<style>
:root{color-scheme:light;--fg:#111;--mut:#888;--line:#ddd;--acc:#5b4bdb}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;font-family:-apple-system,system-ui,sans-serif;color:var(--fg);background:#fff}
#app{display:flex;height:100%}
#app.noside #side{display:none}
#side{width:220px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#f7f7f9}
#side header{padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
#list{overflow:auto;flex:1}
.item{padding:10px 12px;border-bottom:1px solid var(--line)}
.item.sel{background:#eceaff}
.item small{display:block;color:var(--mut)}
#main{flex:1;display:flex;min-width:0}
#empty{margin:auto;color:var(--mut)}
#editor{flex:1;display:flex;min-width:0;min-height:0}
#col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#head{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;font-size:20px;font-weight:700;border:0;outline:0;background:transparent}
button,select{font-size:13px;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:#c62828;border-color:#e3b0b0}
#tools{width:140px;border-left:1px solid var(--line);padding:2px 8px 10px;overflow:auto;background:#f7f7f9}
#tools details{border-bottom:1px solid var(--line);padding-bottom:6px}
#tools summary{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#555;padding:10px 2px;list-style:none;cursor:pointer}
#tools summary::-webkit-details-marker{display:none}
#tools summary::before{content:'\25B8';display:inline-block;width:14px}
#tools details[open]>summary::before{content:'\25BE'}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
.g .wide{grid-column:span 2}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
#bpm{width:100%;font-size:16px;padding:6px;border:1px solid var(--line);border-radius:8px}
#bk{display:block;color:var(--mut);font-size:11px;line-height:1.3}
#scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#paper{position:relative}
#cv{position:sticky;top:0;left:0;display:block;z-index:1;-webkit-user-select:none;-webkit-touch-callout:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;pointer-events:none;max-width:90%;text-align:center}
.tb{position:absolute;z-index:3;pointer-events:none;display:flex;align-items:flex-start;transform-origin:0 0}
#paper.tmode .tb,#paper.smode .tb{pointer-events:auto}
#paper.smode .tb:not(.editing){touch-action:none}
.tx{display:block;width:220px;min-height:30px;padding:4px 6px;border:1px dashed transparent;border-radius:4px;background:transparent;font:16px/1.3 -apple-system,system-ui,sans-serif;color:#111;resize:none;overflow:hidden;outline:0;-webkit-appearance:none}
.tx[readonly]{-webkit-user-select:none;user-select:none}
#paper.tmode .tx,#paper.smode .tx{border-color:#bbb}
.x{display:none;padding:0 6px;font-size:14px;line-height:1.2}
#paper.tmode .x,#paper.smode .x{display:block}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:20}
#modal .card{background:#fff;border-radius:14px;padding:18px;max-width:360px;width:90%}
#modal h3{margin:0 0 8px;font-size:18px}
#modal p{margin:0 0 14px;color:#444;font-size:15px;line-height:1.4}
#modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#modal button{font-size:15px;padding:9px 14px}
#mOk{background:#c62828;color:#fff;border-color:#c62828}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>Notes <button id="add">+ New</button></header>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="empty">Create a note to get started</div>
    <div id="editor" hidden>
      <div id="col">
        <div id="head">
          <button id="tog" title="Notes list">&#9776;</button>
          <input id="title" placeholder="Title" autocomplete="off" autocapitalize="words">
          <button id="undo">Undo</button><button id="redo">Redo</button>
        </div>
        <div id="scroll"><div id="paper"><canvas id="cv"></canvas></div></div>
      </div>
      <div id="tools">
        <details open data-sec="draw"><summary>Draw</summary>
          <div class="g">
            <button data-tool="pen" class="on">Pen</button><button data-tool="eraser">Eraser</button>
            <input type="color" id="color" value="#111111"><select id="width"><option value="2">Thin</option><option value="3" selected>Med</option><option value="6">Thick</option></select>
          </div>
        </details>
        <details open data-sec="notes"><summary>Notation</summary>
          <div class="g">
            <button data-tool="note">Note</button><button data-tool="rest">Rest</button>
            <button id="stackBtn" class="wide">Stack notes: off</button>
            <button data-d="4">Whole</button><button data-d="2">Half</button>
            <button data-d="1" class="on">Qtr</button><button data-d="0.5">8th</button>
            <button data-d="0.25">16th</button><span></span>
            <button data-a="1">&#9839;</button><button data-a="-1">&#9837;</button>
          </div>
        </details>
        <details data-sec="clef"><summary>Clef &amp; time</summary>
          <div class="g">
            <button data-clef="treble">Treble</button><button data-clef="bass">Bass</button>
            <button data-clef="alto">Alto</button><button data-clef="tenor">Tenor</button>
            <select id="tsSel" class="wide"><option>2/4</option><option>3/4</option><option selected>4/4</option><option>5/4</option><option>2/2</option><option>3/8</option><option>6/8</option><option>9/8</option><option>12/8</option></select>
            <button data-tool="time" class="wide">Place time sig</button>
          </div>
        </details>
        <details data-sec="text"><summary>Text &amp; move</summary>
          <div class="g">
            <button data-tool="text">Text</button><button data-tool="select">Select</button>
            <button data-tool="hand" class="wide">Hand (scroll)</button>
          </div>
        </details>
        <details open data-sec="play"><summary>Playback</summary>
          <div class="g">
            <button data-tool="box">&#9654; Box</button><button id="stop">&#9632; Stop</button>
          </div>
          <input id="bpm" type="number" min="30" max="300" value="100" title="Tempo (BPM)">
        </details>
        <details data-sec="view"><summary>View</summary>
          <div class="g">
            <button id="zout">&minus;</button><button id="zin">+</button>
            <button id="zlbl">100%</button><button id="addpg">+ Page</button>
            <button id="staffBtn" class="wide on">Staff lines</button>
          </div>
        </details>
        <details data-sec="files"><summary>Files &amp; backup</summary>
          <div class="g">
            <button id="expAll" class="wide">Export all notes</button>
            <button id="expOne" class="wide">Export this note</button>
            <button id="impBtn" class="wide">Import file</button>
            <button id="del" class="wide danger">Delete note&hellip;</button>
          </div>
          <small id="bk"></small>
        </details>
      </div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden><div class="card">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <div class="row"><button id="mCancel">Cancel</button><button id="mExport">Export first</button><button id="mOk">Delete</button></div>
</div></div>
<input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden>
<script>
const $=s=>document.querySelector(s),KEY='musicnotes.v1',P=140,ST=5,PW=1100,SX=74,RM=12,MPS=4;
const PITCH=[0,2,4,5,7,9,11],BASE={treble:30,bass:18,alto:24,tenor:22};
let sideHidden=false;try{sideHidden=localStorage.getItem('musicnotes.side')==='1'}catch(e){}
let notes=[],cur=null,tool='pen',clefPick='treble',drag=null,live=null,timer=null,dur=1,acc=0,Z=1,drawId=null,pinch=null,pinchT=0,raf=0,toastT=0;
let mv=null,lastTap={t:0,b:null},hl=new Set(),boxR=null,AC=null,master=null,tms=[],hist=[],redoS=[],eraseOp=null,LY=null,paperPW=PW,stack=false,remind=true;
const cv=$('#cv'),ctx=cv.getContext('2d'),sv=$('#scroll'),paper=$('#paper'),ptrs=new Map(),BB=new WeakMap(),tbs=[];
const PH=()=>(cur&&cur.h)||5000,Y0=k=>100+k*P,fitZ=()=>Math.max(0.25,Math.min(1,sv.clientWidth/PW));
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}

/* ---------- storage + migration ---------- */
function migrate(n){
  if(!n.items){
    n.items=(n.strokes||[]).map(s=>({k:'s',c:s.c,w:s.w,p:s.p}));
    if(n.text&&n.text.trim())n.items.push({k:'t',x:20,y:20,t:n.text});
    ((n.score&&n.score.ev)||[]).forEach((e,i)=>{const x=70+(i%12)*55,sys=Math.floor(i/12);
      n.items.push(e.r?{k:'r',x,sys,d:e.d}:{k:'n',x,sys,s:e.s,d:e.d,a:e.a})});
    n.bpm=(n.score&&n.score.bpm)||100;delete n.strokes;delete n.text;delete n.score;
  }
  // old free-placed notes -> measure/beat positions
  const old=n.items.filter(i=>(i.k==='n'||i.k==='r')&&i.m===undefined);
  if(old.length||n.clef||n.clefs){
    const by={},sm={};let last=-1;
    old.forEach(i=>(by[i.sys]=by[i.sys]||[]).push(i));
    Object.keys(by).map(Number).sort((a,b)=>a-b).forEach(s=>{
      let sys=Math.max(s,last+1),m=0,t=0,cs=null;sm[s]=sys;
      by[s].sort((a,b)=>a.x-b.x).forEach(i=>{
        if(cs&&Math.abs(i.x-cs.x)<=10){i.sys=cs.sys;i.m=cs.m;i.t=cs.t;delete i.x;return}
        if(t+i.d>4+1e-6){m++;t=0}
        if(m>=MPS){sys++;m=0;t=0}
        cs={x:i.x,sys,m,t};i.sys=sys;i.m=m;i.t=t;t+=i.d;delete i.x;
      });
      last=sys;
    });
    const cl=Object.assign({},n.clefs||{});
    Object.keys(by).forEach(s=>{if(n.clef&&!cl[s])cl[s]=n.clef});
    Object.keys(cl).forEach(s=>{if(cl[s]&&cl[s]!=='treble')n.items.push({k:'c',c:cl[s],sys:sm[s]!==undefined?sm[s]:+s,m:0})});
    delete n.clef;delete n.clefs;
  }
}
function load(){try{notes=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){notes=[]}notes.forEach(migrate)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){alert('Could not save: storage is full or blocked.')}}
function saveSoon(){clearTimeout(timer);timer=setTimeout(save,400)}

/* ---------- list / render ---------- */
function renderList(){
  const L=$('#list');L.textContent='';
  notes.sort((a,b)=>b.t-a.t).forEach(n=>{
    const d=document.createElement('div');d.className='item'+(cur&&cur.id===n.id?' sel':'');
    const b=document.createElement('b');b.textContent=n.title||'Untitled';
    const s=document.createElement('small');s.textContent=new Date(n.t).toLocaleDateString();
    d.append(b,s);d.onclick=()=>{cur=n;render()};L.append(d);
  });
}
function render(){
  renderList();
  $('#app').classList.toggle('noside',sideHidden&&!!cur);
  $('#editor').hidden=!cur;$('#empty').hidden=!!cur;
  if(!cur)return;
  $('#title').value=cur.title;$('#staffBtn').classList.toggle('on',cur.staff!==false);$('#bpm').value=cur.bpm||100;
  hist=[];redoS=[];stopPlay();paperPW=PW;Z=fitZ();sv.scrollTop=0;sv.scrollLeft=0;fit();renderTexts();
  if(remind){remind=false;const lb=+localStorage.getItem('musicnotes.lastBackup')||0;if(Date.now()-lb>7*864e5)setTimeout(()=>toast('Tip: export a backup in Files & backup'),1500)}
}

/* ---------- items + history ---------- */
function touch(){cur.t=Date.now();renderList();saveSoon();redraw()}
function addItem(it){cur.items.push(it);hist.push({t:'a',it});redoS=[];touch()}
function delItems(list){
  const rec=[];
  list.forEach(it=>{const i=cur.items.indexOf(it);if(i>=0){cur.items.splice(i,1);rec.push({i,it})}});
  if(rec.length){hist.push({t:'d',rec});redoS=[];touch();renderTexts()}
}
function undo(){
  const o=hist.pop();if(!o)return;
  if(o.t==='a'){const i=cur.items.indexOf(o.it);if(i>=0)cur.items.splice(i,1)}
  else if(o.t==='p')Object.assign(o.it,o.a);
  else for(let j=o.rec.length-1;j>=0;j--){
    const r=o.rec[j];
    (r.pieces||[]).forEach(q=>{const k=cur.items.indexOf(q);if(k>=0)cur.items.splice(k,1)});
    cur.items.splice(r.i,0,r.it);
  }
  redoS.push(o);touch();renderTexts();
}
function redo(){
  const o=redoS.pop();if(!o)return;
  if(o.t==='a')cur.items.push(o.it);
  else if(o.t==='p')Object.assign(o.it,o.b);
  else o.rec.forEach(r=>{const i=cur.items.indexOf(r.it);if(i>=0)cur.items.splice(i,1,...(r.pieces||[]))});
  hist.push(o);touch();renderTexts();
}

/* ---------- layout: measures, meters, clefs ---------- */
// Every note lives at (staff line, measure, beat). Spacing follows rhythm, and a measure
// widens when its notes need more room, so notes never pile on top of each other.
function buildLayout(){
  const cells={},key=(s,m)=>s*16+m;
  const cell=(s,m)=>cells[key(s,m)]||(cells[key(s,m)]={tt:new Map(),clef:null,ts:null});
  const meters=[],used=new Set();
  cur.items.forEach(i=>{
    if(i.k==='n'||i.k==='r'){
      const c=cell(i.sys,i.m),tk=+i.t.toFixed(3);let o=c.tt.get(tk);
      if(!o){o={t:tk,d:0,acc:false};c.tt.set(tk,o)}
      o.d=Math.max(o.d,i.d);if(i.a)o.acc=true;used.add(i.sys);
    }else if(i.k==='c'){cell(i.sys,i.m).clef=i;used.add(i.sys)}
    else if(i.k==='m'){cell(i.sys,i.m).ts=i;meters.push(i);used.add(i.sys)}
  });
  meters.sort((a,b)=>a.sys-b.sys||a.m-b.m);
  const m0=cur.meter0||{n:4,d:4},BW=(PW-SX-RM)/MPS,sysC={};
  const meterAt=(s,m)=>{let r=m0;for(const t of meters){if(t.sys<s||(t.sys===s&&t.m<=m))r=t;else break}return r};
  function sysCells(s){
    if(sysC[s])return sysC[s];
    const arr=[];let x=SX;
    for(let m=0;m<MPS;m++){
      const c=cell(s,m),mt=meterAt(s,m),cols=[...c.tt.values()].sort((a,b)=>a.t-b.t);
      c.meter=mt;c.cap=mt.n*4/mt.d;
      c.ext=cols.reduce((a,o)=>Math.max(a,o.t+o.d),0);c.capEff=Math.max(c.cap,c.ext);
      c.lp=10+(m>0?(c.clef?24:0)+(c.ts?28:0):0);
      const K0=(BW-c.lp-10)/c.capEff;let px=-1e9;
      c.xs=new Map();
      cols.forEach((o,j)=>{
        let xx=c.lp+o.t*K0;
        xx=j?Math.max(xx,px+22+(o.acc?12:0)):Math.max(xx,c.lp+(o.acc?14:0));
        px=xx;c.xs.set(o.t,xx);
      });
      c.w=Math.max(BW,cols.length?px+26:0);
      const a=new Map([[0,c.lp]]);c.xs.forEach((v,k)=>a.set(k,v));a.set(c.capEff,c.w-10);
      c.anch=[...a.entries()].sort((p,q)=>p[0]-q[0]);
      c.x0=x;x+=c.w;arr.push(c);
    }
    return sysC[s]=arr;
  }
  const get=(s,m)=>sysCells(s)[m];
  // a clef applies from its measure to the end of that line only
  const clefAt=(s,m)=>{for(let k=m;k>=0;k--){const c=cells[key(s,k)];if(c&&c.clef)return c.clef.c}return'treble'};
  const abs=(s,m)=>{let a=0;for(let i=0;i<s;i++)for(let j=0;j<MPS;j++)a+=get(i,j).cap;for(let j=0;j<m;j++)a+=get(s,j).cap;return a};
  const end=s=>{const l=sysCells(s)[MPS-1];return l.x0+l.w};
  const xAt=(c,t)=>{const a=c.anch;for(let i=1;i<a.length;i++)if(t<=a[i][0]){const[t0,x0]=a[i-1],[t1,x1]=a[i];return c.x0+x0+(x1-x0)*(t1===t0?0:(t-t0)/(t1-t0))}return c.x0+a[a.length-1][1]};
  let pw=PW;used.forEach(s=>{pw=Math.max(pw,end(s)+RM)});
  return{get,sysCells,meterAt,clefAt,abs,end,xAt,pw};
}
function itemX(it){const c=LY.get(it.sys,it.m),x=c.xs.get(+it.t.toFixed(3));return c.x0+(x===undefined?c.lp:x)}
function pos(it){
  if(it.k==='n')return[itemX(it),Y0(it.sys)-it.s*ST];
  if(it.k==='r')return[itemX(it),Y0(it.sys)-20];
  return[LY.get(it.sys,it.m).x0+(it.m?14:32),Y0(it.sys)-20];
}
const midi=(s,a,sys,m)=>{const dn=s+BASE[LY.clefAt(sys,m)];return 12*(Math.floor(dn/7)+1)+PITCH[dn%7]+a};

/* ---------- drawing engine (viewport canvas) ---------- */
function sizePaper(){
  paper.style.width=paperPW*Z+'px';paper.style.height=PH()*Z+'px';
  $('#zlbl').textContent=Math.round(Z*100)+'%';
}
function fit(){
  const d=window.devicePixelRatio||1,w=sv.clientWidth,h=sv.clientHeight;
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=w*d;cv.height=h*d;
  sizePaper();posBoxes();redraw();
}
function box(s){
  let b=BB.get(s);
  if(!b){b=[1e9,1e9,-1e9,-1e9];s.p.forEach(q=>{b[0]=Math.min(b[0],q[0]);b[1]=Math.min(b[1],q[1]);b[2]=Math.max(b[2],q[0]);b[3]=Math.max(b[3],q[1])});BB.set(s,b)}
  return b;
}
function redraw(){
  const d=window.devicePixelRatio||1;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(d*Z,0,0,d*Z,-sv.scrollLeft*d,-sv.scrollTop*d);
  if(!cur)return;
  LY=buildLayout();if(LY.pw!==paperPW){paperPW=LY.pw;sizePaper()}
  const v0=sv.scrollTop/Z,v1=v0+sv.clientHeight/Z,u0=sv.scrollLeft/Z,u1=u0+sv.clientWidth/Z;
  if(cur.staff!==false)drawStaves(v0,v1);
  cur.items.forEach(it=>{
    if(it.k==='s'){if(it!==live){const b=box(it);if(b[2]<u0-20||b[0]>u1+20||b[3]<v0-20||b[1]>v1+20)return}drawStroke(it)}
  });
  const cols=columns(),B=beamGroups(cols);
  cols.forEach(c=>{const y=Y0(c.sys);if(y<v0-120||y>v1+60)return;drawCol(c,B.inG.has(c))});
  B.groups.forEach(g=>{const y=Y0(g[0].sys);if(y>=v0-120&&y<=v1+60)drawBeam(g)});
  if(boxR){ctx.fillStyle='rgba(91,75,219,.12)';ctx.strokeStyle='#5b4bdb';ctx.lineWidth=1.5/Z;ctx.setLineDash([6/Z,4/Z]);
    ctx.fillRect(boxR[0],boxR[1],boxR[2]-boxR[0],boxR[3]-boxR[1]);ctx.strokeRect(boxR[0],boxR[1],boxR[2]-boxR[0],boxR[3]-boxR[1]);ctx.setLineDash([])}
}
function drawStroke(s){
  ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineCap='round';ctx.lineJoin='round';
  if(s.p.length===1){ctx.beginPath();ctx.arc(s.p[0][0],s.p[0][1],s.w*(0.4+1.2*s.p[0][2])/2,0,7);ctx.fill();return}
  for(let i=1;i<s.p.length;i++){
    const a=s.p[i-1],b=s.p[i];ctx.lineWidth=s.w*(0.4+1.2*b[2]);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  }
}

/* ---------- notation drawing ---------- */
function clefTreble(cx,y0){
  ctx.strokeStyle='#555';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(cx,y0+8);ctx.lineTo(cx,y0-44);
  ctx.moveTo(cx,y0+8);ctx.bezierCurveTo(cx,y0+16,cx-9,y0+16,cx-8,y0+10);
  ctx.moveTo(cx,y0-44);ctx.bezierCurveTo(cx+10,y0-50,cx+12,y0-34,cx,y0-24);
  ctx.moveTo(cx,y0-24);ctx.bezierCurveTo(cx-17,y0-20,cx-14,y0+3,cx+2,y0+2);

// A column = everything on one beat of one measure. A chord shares ONE stem.

  Object.values(by).forEach(arr=>{
    const mt=LY.get(arr[0].sys,arr[0].m).meter,unit=(mt.d===8&&mt.n%3===0)?1.5:1;
    arr.sort((a,b)=>a.t-b.t);

    arr.forEach(c=>{

/* ---------- placing notation ---------- */
function placeNote(p,sys,m,rest){
  const c=LY.get(sys,m),d=dur,mt=c.meter,s=Math.max(-6,Math.min(14,Math.round((Y0(sys)-p[1])/ST)));
  if(d>c.cap+1e-6){toast('That note is longer than a '+mt.n+'/'+mt.d+' measure');return}
  const mine=cur.items.filter(i=>(i.k==='n'||i.k==='r')&&i.sys===sys&&i.m===m);
  // tapping directly on an existing note of the same length stacks a chord
  if(!rest&&stack){
    const col=mine.find(i=>i.k==='n'&&i.d===d&&Math.abs(itemX(i)-p[0])<=9);
    if(col){
      if(mine.some(i=>i.k==='n'&&i.t===col.t&&Math.abs(i.s-s)<=1)){toast('Chord notes need a gap between them');return}
      addItem({k:'n',sys,m,t:col.t,s,d,a:acc});ping(midi(s,acc,sys,m));return;
    }
  }
  // otherwise snap to the nearest beat that is still free; never past the end of the measure
  let best=null;
  for(let t=0;t<=c.cap-d+1e-6;t+=d){
    if(mine.some(i=>t<i.t+i.d-1e-6&&i.t<t+d-1e-6))continue;
    // measure where the note would really be drawn (neighbours get pushed aside), so tapping
    // right after the last note continues the run instead of jumping to the next beat
    cur.items.push({k:rest?'r':'n',sys,m,t,s,d,a:rest?0:acc});
    const L2=buildLayout(),c2=L2.get(sys,m),px=c2.x0+c2.xs.get(+t.toFixed(3));
    cur.items.pop();
    const dx=Math.abs(px-p[0]);
    if(!best||dx<best.dx-1e-6)best={t,dx};
  }
  if(!best){toast('This '+mt.n+'/'+mt.d+' measure is full');return}
  if(rest){addItem({k:'r',sys,m,t:best.t,d});return}
  addItem({k:'n',sys,m,t:best.t,s,d,a:acc});ping(midi(s,acc,sys,m));
}
function setSym(kind,sys,m){
  const k=kind==='clef'?'c':'m',old=cur.items.find(i=>i.k===k&&i.sys===sys&&i.m===m);
  let val;
  if(k==='c')val={c:clefPick};else{const q=$('#tsSel').value.split('/');val={n:+q[0],d:+q[1]}}
  if(old){const a={};Object.keys(val).forEach(q=>a[q]=old[q]);Object.assign(old,val);hist.push({t:'p',it:old,a,b:val});redoS=[];touch()}

}

/* ---------- audio: synthesized piano ---------- */
function ensureAC(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}

function piano(m,t,len){
  const f=440*Math.pow(2,(m-69)/12),rel=AC.createGain(),lp=AC.createBiquadFilter(),end=t+Math.min(len,8)*0.92;

    g.gain.exponentialRampToValueAtTime(0.0005,t+dec/(1+0.5*i));
    o.connect(g);g.connect(rel);o.start(t);o.stop(end+0.3);
  });
}

function playBox(){
  LY=buildLayout();

  const pad=(x1-x0<8&&y1-y0<8)?16:6;
  const sel=cur.items.filter(it=>{if(it.k!=='n'&&it.k!=='r')return false;const p=pos(it);return p[0]>=x0-pad&&p[0]<=x1+pad&&p[1]>=y0-pad&&p[1]<=y1+pad});

function hit(it,p,r){
  if(it.k==='s'||it.k==='t')return false;
  const q=pos(it);return Math.hypot(q[0]-p[0],q[1]-p[1])<r+(it.k==='c'||it.k==='m'?12:6);

function segD2(a,b,p){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));
  const x=a[0]+t*dx-p[0],y=a[1]+t*dy-p[1];return x*x+y*y;

function cutStroke(s,p,r){
  const q=s.p,n=q.length,bad=new Array(n).fill(false),r2=r*r;let any=false;
  for(let i=0;i<n;i++){
    if((q[i][0]-p[0])**2+(q[i][1]-p[1])**2<r2){bad[i]=true;any=true}
    else if(i>0&&segD2(q[i-1],q[i],p)<r2){bad[i]=bad[i-1]=true;any=true}
  }

  }

cv.addEventListener('pointerdown',e=>{
  if(!cur)return;
  if(e.pointerType==='touch')ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(tool==='hand')return;
  // a second finger = pinch-zoom, never a second line
  if(ptrs.size>=2&&!(live&&live.pen)){cancelDrag();pinch={d:two().d,z:Z};pinchT=Date.now();return}
  if(drawId!==null||pinch||!['pen','eraser','box'].includes(tool))return;
  drawId=e.pointerId;cv.setPointerCapture(e.pointerId);
  const p=pt(e);
  if(tool==='pen'){live={k:'s',c:$('#color').value,w:+$('#width').value,p:[p],pen:e.pointerType==='pen'};cur.items.push(live);drawStroke(live)}
  else if(tool==='eraser'){drag='erase';eraseOp=[];erase(p)}
  else{stopPlay();drag='box';boxR=[p[0],p[1],p[0],p[1]];redraw()}
});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const t=two(),r=sv.getBoundingClientRect();setZoom(pinch.z*t.d/pinch.d,t.x-r.left,t.y-r.top);return}
  if(e.pointerId!==drawId)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  (evs.length?evs:[e]).forEach(ev=>{
    const p=pt(ev);
    if(drag==='erase')erase(p);
    else if(drag==='box'){boxR[2]=p[0];boxR[3]=p[1]}
    else if(live){
      const prev=live.p[live.p.length-1];live.p.push(p);
      ctx.strokeStyle=live.c;ctx.lineCap='round';ctx.lineWidth=live.w*(0.4+1.2*p[2]);
      ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();
    }
  });
  if(drag==='box')redraw();
});
function up(e){
  ptrs.delete(e.pointerId);
  if(pinch&&ptrs.size<2){pinch=null;pinchT=Date.now()}
  if(e.pointerId!==drawId)return;
  drawId=null;
  if(live){hist.push({t:'a',it:live});redoS=[];live=null;touch()}
  else if(drag==='erase'){if(eraseOp.length){hist.push({t:'d',rec:eraseOp});redoS=[]}eraseOp=null}
  else if(drag==='box')playBox();
  drag=null;
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
// Notes, rests, clefs, time signatures and text are placed with a tap
cv.addEventListener('click',e=>{
  if(!cur||!['note','rest','text','clef','time'].includes(tool)||Date.now()-pinchT<450)return;
  const p=pt(e);
  if(tool==='text'){mkBox({k:'t',x:p[0],y:p[1],t:''},true);return}
  if(cur.staff===false){toast('Turn Staff on to place notation');return}
  const sys=Math.max(0,Math.min(Math.floor(PH()/P)-1,Math.round((p[1]-80)/P))),y0=Y0(sys);
  LY=buildLayout();
  if(p[1]>y0+34||p[1]<y0-74||p[0]<0||p[0]>LY.end(sys)){toast('Tap on a staff');return}
  const S=LY.sysCells(sys);let m=S.findIndex(c=>p[0]<c.x0+c.w);if(m<0)m=MPS-1;
  if(tool==='clef'||tool==='time')setSym(tool,sys,m);
  else placeNote(p,sys,m,tool==='rest');
});

/* ---------- buttons ---------- */
function setTool(t){
  tool=t;ensureAC();
  document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool===t));
  document.querySelectorAll('[data-clef]').forEach(x=>x.classList.toggle('on',t==='clef'&&x.dataset.clef===clefPick));
  cv.style.touchAction=t==='hand'?'pan-x pan-y':'none';
  paper.classList.toggle('tmode',t==='text');paper.classList.toggle('smode',t==='select');
  tbs.forEach(b=>setEdit(b,t==='text'));
}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('[data-clef]').forEach(b=>b.onclick=()=>{clefPick=b.dataset.clef;setTool('clef')});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dur=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{acc=acc===+b.dataset.a?0:+b.dataset.a;document.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',+x.dataset.a===acc))});
$('#tsSel').onchange=()=>setTool('time');
$('#stop').onclick=stopPlay;
$('#add').onclick=()=>{cur={id:Date.now().toString(36),title:'',items:[],staff:true,t:Date.now(),h:5000,bpm:100};notes.unshift(cur);save();render()};
$('#title').oninput=e=>{cur.title=e.target.value;cur.t=Date.now();renderList();saveSoon()};
$('#bpm').onchange=e=>{cur.bpm=+e.target.value||100;save()};
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#zin').onclick=()=>setZoom(Z*1.25);$('#zout').onclick=()=>setZoom(Z/1.25);$('#zlbl').onclick=()=>setZoom(fitZ());
$('#addpg').onclick=()=>{cur.h=PH()+1600;sizePaper();redraw();save()};
$('#staffBtn').onclick=()=>{cur.staff=cur.staff===false;$('#staffBtn').classList.toggle('on',cur.staff!==false);redraw();save()};
$('#tog').onclick=()=>{sideHidden=!sideHidden;try{localStorage.setItem('musicnotes.side',sideHidden?'1':'0')}catch(e){}$('#app').classList.toggle('noside',sideHidden);fit()};
addEventListener('resize',()=>{if(cur)fit()});
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ---------- collapsible menu sections ---------- */
let sec={};try{sec=JSON.parse(localStorage.getItem('musicnotes.sec'))||{}}catch(e){}
document.querySelectorAll('#tools details').forEach(d=>{
  const k=d.dataset.sec;if(k in sec)d.open=sec[k];
  d.addEventListener('toggle',()=>{sec[k]=d.open;try{localStorage.setItem('musicnotes.sec',JSON.stringify(sec))}catch(e){}});
});
$('#stackBtn').onclick=e=>{stack=!stack;e.target.classList.toggle('on',stack);e.target.textContent='Stack notes: '+(stack?'on':'off')};

/* ---------- files: export / import / delete warning ---------- */
const stamp=()=>new Date().toISOString().slice(0,10);
function updateBk(){
  const t=+localStorage.getItem('musicnotes.lastBackup')||0;
  $('#bk').textContent=t?'Last backup: '+new Date(t).toLocaleDateString():'No backup yet. Export to the Files app to keep your notes safe.';
}
async function saveFile(name,text){
  const tries=[[name,'application/json'],[name.replace(/\.json$/,'.txt'),'text/plain']];
  for(const[n,type]of tries){
    try{
      const f=new File([text],n,{type});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return true}
    }catch(e){if(e&&e.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}
const pack=list=>JSON.stringify({app:'music-notes',v:1,exported:new Date().toISOString(),notes:list});
async function exportAll(){
  if(!notes.length){toast('No notes to export yet');return}
  if(await saveFile('music-notes-backup-'+stamp()+'.json',pack(notes))){try{localStorage.setItem('musicnotes.lastBackup',Date.now())}catch(e){}updateBk()}
}
async function exportNote(){
  if(!cur)return;save();
  const nm=((cur.title||'note').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'note');
  await saveFile(nm+'-'+stamp()+'.json',pack([cur]));
}
$('#expAll').onclick=exportAll;$('#expOne').onclick=exportNote;
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text()),list=Array.isArray(data)?data:data.notes;
    if(!Array.isArray(list))throw 0;
    let n=0;
    list.forEach(x=>{
      if(!x||typeof x!=='object'||!x.id)return;
      migrate(x);if(!x.items)return;
      const i=notes.findIndex(o=>o.id===x.id);
      if(i<0){notes.push(x);n++}
      else if((x.t||0)>(notes[i].t||0)){if(cur===notes[i])cur=x;notes[i]=x;n++}
    });
    save();render();toast(n?'Imported '+n+' note'+(n>1?'s':''):'Nothing new to import');
  }catch(err){toast('That file is not a Music Notes backup')}
};
$('#del').onclick=()=>{
  if(!cur)return;
  $('#mTitle').textContent='Delete \u201C'+(cur.title||'Untitled')+'\u201D?';
  $('#mText').textContent='This permanently deletes the whole page, including every drawing, note, rest and text box on it. This can\u2019t be undone.';
  $('#modal').hidden=false;
};
$('#mCancel').onclick=()=>{$('#modal').hidden=true};
$('#mExport').onclick=exportNote;
$('#mOk').onclick=()=>{$('#modal').hidden=true;notes=notes.filter(n=>n!==cur);cur=null;save();render()};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

load();render();updateBk();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
