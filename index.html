<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music Notes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Music Notes</title>
<style>
:root{color-scheme:light;--fg:#111;--mut:#888;--line:#ddd;--acc:#5b4bdb}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;font-family:-apple-system,system-ui,sans-serif;color:var(--fg);background:#fff}
#app{display:flex;height:100%}
#app.noside #side{display:none}
#side{width:220px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#f7f7f9}
#side header{padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
#list{overflow:auto;flex:1}
.item{padding:10px 12px;border-bottom:1px solid var(--line)}
.item.sel{background:#eceaff}
.item small{display:block;color:var(--mut)}
#main{flex:1;display:flex;min-width:0}
#empty{margin:auto;color:var(--mut)}
#editor{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#head{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;font-size:20px;font-weight:700;border:0;outline:0;background:transparent}
button,select{font-size:13px;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:#c62828;border-color:#e3b0b0}
#scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#paper{position:relative}
#cv{position:sticky;top:0;left:0;display:block;z-index:1;-webkit-user-select:none;-webkit-touch-callout:none}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;pointer-events:none;max-width:90%;text-align:center}
.tb{position:absolute;z-index:3;pointer-events:none;display:flex;align-items:flex-start;transform-origin:0 0}
#paper.tmode .tb,#paper.smode .tb{pointer-events:auto}
#paper.smode .tb:not(.editing){touch-action:none}
.tx{display:block;width:220px;min-height:30px;padding:4px 6px;border:1px dashed transparent;border-radius:4px;background:transparent;font:16px/1.3 -apple-system,system-ui,sans-serif;color:#111;resize:none;overflow:hidden;outline:0;-webkit-appearance:none}
.tx[readonly]{-webkit-user-select:none;user-select:none}
#paper.tmode .tx,#paper.smode .tx{border-color:#bbb}
.x{display:none;padding:0 6px;font-size:14px;line-height:1.2}
#paper.tmode .x,#paper.smode .x{display:block}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:20}
#modal .card{background:#fff;border-radius:14px;padding:18px;max-width:360px;width:90%}
#modal h3{margin:0 0 8px;font-size:18px}
#modal p{margin:0 0 14px;color:#444;font-size:15px;line-height:1.4}
#modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#modal button{font-size:15px;padding:9px 14px}
#mOk{background:#c62828;color:#fff;border-color:#c62828}
#dock{flex:none;border-top:1px solid var(--line);background:#f7f7f9;padding-bottom:env(safe-area-inset-bottom)}
#tabs{display:flex;gap:6px;padding:6px 10px;overflow-x:auto}
#tabs button{flex:none;height:34px;padding:0 12px;white-space:nowrap;font-size:14px}
#tabs button.on{background:#fff;color:var(--acc);border-color:var(--acc);font-weight:600}
#tabs img{height:26px;width:auto}
#panel{display:flex;gap:14px;padding:2px 10px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#panel section{flex:none;display:none}
#panel section.open{display:block}
#panel section.open~section.open{border-left:1px solid var(--line);padding-left:14px}
.g{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,40px);grid-auto-columns:minmax(42px,auto);gap:5px}
.g button,.g select,.g input[type=color]{height:40px;min-width:42px;padding:0 8px;font-size:15px}
.g button img{display:block;margin:auto;pointer-events:none}
.g [data-clef] img{height:34px;width:auto}
button.on img{filter:invert(1)}
.sym{font-size:22px!important;line-height:1}
input[type=color]{border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff;width:46px}
.bpmw{grid-row:span 2;display:flex;align-items:center;gap:4px;font-size:20px}
#bpm{width:66px;font-size:16px;padding:6px;border:1px solid var(--line);border-radius:8px}
#bk{display:block;margin-top:4px;color:var(--mut);font-size:11px;line-height:1.3;max-width:240px}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>Notes <button id="add">+ New</button></header>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="empty">Create a note to get started</div>
    <div id="editor" hidden>
      <div id="col">
        <div id="head">
          <button id="tog" title="Notes list">&#9776;</button>
          <input id="title" placeholder="Title" autocomplete="off" autocapitalize="words">
          <button id="undo" class="sym" title="Undo">&#8630;</button><button id="redo" class="sym" title="Redo">&#8631;</button>
        </div>
        <div id="scroll"><div id="paper"><canvas id="cv"></canvas></div></div>
      </div>
      <div id="dock">
        <div id="tabs">
          <button data-tab="draw" title="Draw">&#9998; Draw</button>
          <button data-tab="notes" class="sym" title="Notation">&#9835;</button>
          <button data-tab="clef" title="Clef, key and time"><span data-ico="cTreble"></span></button>
          <button data-tab="text" title="Text and move">T</button>
          <button data-tab="play" title="Playback">&#9654;</button>
          <button data-tab="staves" title="Staves"><span data-ico="staffPlain"></span></button>
          <button data-tab="view">View</button>
          <button data-tab="files">Files</button>
        </div>
        <div id="panel">
          <section data-sec="draw"><div class="g">
            <button data-tool="pen" class="on">Pen</button><button data-tool="eraser">Erase</button>
            <input type="color" id="color" value="#111111"><select id="width"><option value="2">&middot;</option><option value="3" selected>&bull;</option><option value="6">&#9679;</option></select>
          </div></section>
          <section data-sec="notes"><div class="g">
            <button data-tool="note" class="sym" title="Note">&#9835;</button><button data-tool="rest" title="Rest" data-ico="rest"></button>
            <button data-tool="tie" title="Tie" data-ico="tie"></button><button id="dotBtn" title="Dotted" data-ico="dot"></button>
            <button id="stackBtn" title="Stack notes (chords)" data-ico="stack"></button><span></span>
            <button data-d="4" title="Whole" data-ico="w"></button><button data-d="2" title="Half" data-ico="h"></button>
            <button data-d="1" class="on" title="Quarter" data-ico="q"></button><button data-d="0.5" title="Eighth" data-ico="e"></button>
            <button data-d="0.25" title="Sixteenth" data-ico="s"></button><button data-a="2" class="sym" title="Natural">&#9838;</button>
            <button data-a="1" class="sym" title="Sharp">&#9839;</button><button data-a="-1" class="sym" title="Flat">&#9837;</button>
          </div></section>
          <section data-sec="clef"><div class="g">
            <button data-clef="treble" title="Treble clef" data-ico="cTreble"></button><button data-clef="bass" title="Bass clef" data-ico="cBass"></button>
            <button data-clef="alto" title="Alto clef" data-ico="cAlto"></button><button data-clef="tenor" title="Tenor clef" data-ico="cTenor"></button>
            <select id="tsSel"><option>2/4</option><option>3/4</option><option selected>4/4</option><option>5/4</option><option>2/2</option><option>3/8</option><option>6/8</option><option>9/8</option><option>12/8</option></select>
            <button id="tsBtn" data-tool="time" title="Place time signature"></button>
            <select id="keySel"><option value="0">C &middot; Am</option><option value="1">G &middot; 1&#9839;</option><option value="2">D &middot; 2&#9839;</option><option value="3">A &middot; 3&#9839;</option><option value="4">E &middot; 4&#9839;</option><option value="5">B &middot; 5&#9839;</option><option value="6">F&#9839; &middot; 6&#9839;</option><option value="7">C&#9839; &middot; 7&#9839;</option><option value="-1">F &middot; 1&#9837;</option><option value="-2">B&#9837; &middot; 2&#9837;</option><option value="-3">E&#9837; &middot; 3&#9837;</option><option value="-4">A&#9837; &middot; 4&#9837;</option><option value="-5">D&#9837; &middot; 5&#9837;</option><option value="-6">G&#9837; &middot; 6&#9837;</option><option value="-7">C&#9837; &middot; 7&#9837;</option></select>
            <button id="keyBtn" data-tool="key" class="sym" title="Place key signature"></button>
          </div></section>
          <section data-sec="text"><div class="g">
            <button data-tool="text">Text</button><button data-tool="select">Select</button><button data-tool="hand">Hand</button>
          </div></section>
          <section data-sec="play"><div class="g">
            <button data-tool="box" title="Drag a box to play it" data-ico="box"></button><button id="stop" class="sym" title="Stop">&#9632;</button>
            <label class="bpmw">&#9833;=<input id="bpm" type="number" min="30" max="300" value="100" title="Tempo (BPM)"></label>
          </div></section>
          <section data-sec="staves"><div class="g">
            <button id="addStaff" title="Add a staff" data-ico="staffPlus"></button><button id="addGrand" title="Add a grand staff" data-ico="grandPlus"></button>
            <button id="rmLine" class="danger" title="Remove last line" data-ico="staffX"></button>
          </div></section>
          <section data-sec="view"><div class="g">
            <button id="zout">&minus;</button><button id="zin">+</button>
            <button id="zlbl">100%</button><button id="addpg">+ Page</button>
            <button id="staffBtn" class="on" title="Staff lines" data-ico="staffPlain"></button>
          </div></section>
          <section data-sec="files"><div>
            <div class="g">
              <button id="expAll">Export all</button><button id="expOne">Export note</button>
              <button id="impBtn">Import</button><button id="del" class="danger">Delete&hellip;</button>
            </div>
            <small id="bk"></small>
          </div></section>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden><div class="card">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <div class="row"><button id="mCancel">Cancel</button><button id="mExport">Export first</button><button id="mOk">Delete</button></div>
</div></div>
<input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden>
<script>
const $=s=>document.querySelector(s),KEY='musicnotes.v1',P=140,ST=5,PW=1100,SX=74,RM=12,MPS=4;
const PITCH=[0,2,4,5,7,9,11],BASE={treble:30,bass:18,alto:24,tenor:22};
const LET={C:0,D:1,E:2,F:3,G:4,A:5,B:6},ORD_S=['F','C','G','D','A','E','B'],ORD_F=['B','E','A','D','G','C','F'];
const KWIN={s:{treble:3,bass:1,alto:2,tenor:2},f:{treble:1,bass:-1,alto:0,tenor:0}};
let sideHidden=false;try{sideHidden=localStorage.getItem('musicnotes.side')==='1'}catch(e){}
let notes=[],cur=null,tool='pen',clefPick='treble',drag=null,live=null,timer=null,dur=1,acc=0,Z=1,drawId=null,pinch=null,pinchT=0,raf=0,toastT=0;
let mv=null,lastTap={t:0,b:null},hl=new Set(),boxR=null,AC=null,master=null,tms=[],hist=[],redoS=[],eraseOp=null,LY=null,paperPW=PW,stack=false,dotted=false,remind=true;
const cv=$('#cv');let ctx=cv.getContext('2d');const sv=$('#scroll'),paper=$('#paper'),ptrs=new Map(),BB=new WeakMap(),tbs=[];
const PH=()=>{if(!cur)return 5000;stv();return Math.max(cur.h||5000,STV.bottom+160)},fitZ=()=>Math.max(0.25,Math.min(1,sv.clientWidth/PW));
// The page is a list of lines you add yourself: a single staff (140px) or a grand staff (two staves joined by a brace, 230px).
let STV={sig:'',arr:[],bottom:0};
function stv(){
  const L=cur.lines||[],sig=cur.id+':'+L.map(l=>l.g?'g':'s').join('');
  if(STV.sig!==sig){
    const arr=[];let top=0;
    L.forEach((l,i)=>{
      if(l.g){arr.push({y0:top+100,line:i,g:'t'},{y0:top+190,line:i,g:'b'});top+=230}
      else{arr.push({y0:top+100,line:i,g:null});top+=140}
    });
    STV={sig,arr,bottom:top};
  }
  return STV.arr;
}
function Y0(k){const a=stv();return a[k]?a[k].y0:100+k*140}
function nSys(){return stv().length}
function sysAtY(y){let b=0,bd=1e9;for(let k=0,n=nSys();k<n;k++){const d=Math.abs(y-(Y0(k)-20));if(d<bd){bd=d;b=k}}return b}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}

/* ---------- storage + migration ---------- */
function migrate(n){
  if(!n.items){
    n.items=(n.strokes||[]).map(s=>({k:'s',c:s.c,w:s.w,p:s.p}));
    if(n.text&&n.text.trim())n.items.push({k:'t',x:20,y:20,t:n.text});
    ((n.score&&n.score.ev)||[]).forEach((e,i)=>{const x=70+(i%12)*55,sys=Math.floor(i/12);
      n.items.push(e.r?{k:'r',x,sys,d:e.d}:{k:'n',x,sys,s:e.s,d:e.d,a:e.a})});
    n.bpm=(n.score&&n.score.bpm)||100;delete n.strokes;delete n.text;delete n.score;
  }
  // old free-placed notes -> measure/beat positions
  const old=n.items.filter(i=>(i.k==='n'||i.k==='r')&&i.m===undefined);
  if(old.length||n.clef||n.clefs){
    const by={},sm={};let last=-1;
    old.forEach(i=>(by[i.sys]=by[i.sys]||[]).push(i));
    Object.keys(by).map(Number).sort((a,b)=>a-b).forEach(s=>{
      let sys=Math.max(s,last+1),m=0,t=0,cs=null;sm[s]=sys;
      by[s].sort((a,b)=>a.x-b.x).forEach(i=>{
        if(cs&&Math.abs(i.x-cs.x)<=10){i.sys=cs.sys;i.m=cs.m;i.t=cs.t;delete i.x;return}
        if(t+i.d>4+1e-6){m++;t=0}
        if(m>=MPS){sys++;m=0;t=0}
        cs={x:i.x,sys,m,t};i.sys=sys;i.m=m;i.t=t;t+=i.d;delete i.x;
      });
      last=sys;
    });
    const cl=Object.assign({},n.clefs||{});
    Object.keys(by).forEach(s=>{if(n.clef&&!cl[s])cl[s]=n.clef});
    Object.keys(cl).forEach(s=>{if(cl[s]&&cl[s]!=='treble')n.items.push({k:'c',c:cl[s],sys:sm[s]!==undefined?sm[s]:+s,m:0})});
    delete n.clef;delete n.clefs;
  }
  if(!n.lines){   // pages made before user-added staves: keep the lines that were in use plus one spare
    let used=0;n.items.forEach(i=>{if('nrcmy'.includes(i.k)&&i.sys!==undefined)used=Math.max(used,i.sys+1)});
    const g=n.grand?1:0,cnt=Math.max(1,Math.ceil(used/(g?2:1)))+1;
    n.lines=Array.from({length:cnt},()=>({g}));delete n.grand;
  }
}
function load(){try{notes=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){notes=[]}notes.forEach(migrate)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){alert('Could not save: storage is full or blocked.')}}
function saveSoon(){clearTimeout(timer);timer=setTimeout(save,400)}

/* ---------- list / render ---------- */
function renderList(){
  const L=$('#list');L.textContent='';
  notes.sort((a,b)=>b.t-a.t).forEach(n=>{
    const d=document.createElement('div');d.className='item'+(cur&&cur.id===n.id?' sel':'');
    const b=document.createElement('b');b.textContent=n.title||'Untitled';
    const s=document.createElement('small');s.textContent=new Date(n.t).toLocaleDateString();
    d.append(b,s);d.onclick=()=>{cur=n;render()};L.append(d);
  });
}
function render(){
  renderList();
  $('#app').classList.toggle('noside',sideHidden&&!!cur);
  $('#editor').hidden=!cur;$('#empty').hidden=!!cur;
  if(!cur)return;
  $('#title').value=cur.title;$('#staffBtn').classList.toggle('on',cur.staff!==false);$('#bpm').value=cur.bpm||100;
  hist=[];redoS=[];stopPlay();paperPW=PW;Z=fitZ();sv.scrollTop=0;sv.scrollLeft=0;fit();renderTexts();
  if(remind){remind=false;const lb=+localStorage.getItem('musicnotes.lastBackup')||0;if(Date.now()-lb>7*864e5)setTimeout(()=>toast('Tip: export a backup in Files & backup'),1500)}
}

/* ---------- items + history ---------- */
function touch(){cur.t=Date.now();renderList();saveSoon();redraw()}
function addItem(it){cur.items.push(it);hist.push({t:'a',it});redoS=[];touch()}
function delItems(list){
  const rec=[];
  list.forEach(it=>{const i=cur.items.indexOf(it);if(i>=0){cur.items.splice(i,1);rec.push({i,it})}});
  if(rec.length){hist.push({t:'d',rec});redoS=[];touch();renderTexts()}
}
function undo(){
  const o=hist.pop();if(!o)return;
  if(o.t==='a'){const i=cur.items.indexOf(o.it);if(i>=0)cur.items.splice(i,1)}
  else if(o.t==='p')Object.assign(o.it,o.a);
  else for(let j=o.rec.length-1;j>=0;j--){
    const r=o.rec[j];
    (r.pieces||[]).forEach(q=>{const k=cur.items.indexOf(q);if(k>=0)cur.items.splice(k,1)});
    cur.items.splice(r.i,0,r.it);
  }
  redoS.push(o);touch();renderTexts();
}
function redo(){
  const o=redoS.pop();if(!o)return;
  if(o.t==='a')cur.items.push(o.it);
  else if(o.t==='p')Object.assign(o.it,o.b);
  else o.rec.forEach(r=>{const i=cur.items.indexOf(r.it);if(i>=0)cur.items.splice(i,1,...(r.pieces||[]))});
  hist.push(o);touch();renderTexts();
}

/* ---------- layout: measures, meters, keys, clefs, grand staves ---------- */
// Every note lives at (staff, measure, beat). Spacing follows rhythm, and a measure widens
// when its notes need more room. In a grand staff the two staves of a pair share one layout,
// so notes on the same beat line up vertically.
function buildLayout(){
  const cells={},key=(s,m)=>s*16+m,SV=stv(),gs=s=>SV[s]&&SV[s].g==='b'?s-1:s,pr=s=>SV[s]&&SV[s].g?[gs(s),gs(s)+1]:[s];
  const cell=(s,m)=>cells[key(s,m)]||(cells[key(s,m)]={tt:new Map(),clef:null,ts:null,key:null});
  const meters=[],keys=[],used=new Set();
  cur.items.forEach(i=>{
    if(i.k==='n'||i.k==='r'){
      const c=cell(i.sys,i.m),tk=+i.t.toFixed(3);let o=c.tt.get(tk);
      if(!o){o={t:tk,d:0,acc:false,dot:false};c.tt.set(tk,o)}
      o.d=Math.max(o.d,i.d);if(i.a)o.acc=true;if(i.dot)o.dot=true;used.add(i.sys);
    }else if(i.k==='c'){cell(i.sys,i.m).clef=i;used.add(i.sys)}
    else if(i.k==='m'){cell(i.sys,i.m).ts=i;meters.push(i);used.add(i.sys)}
    else if(i.k==='y'){cell(i.sys,i.m).key=i;keys.push(i);used.add(i.sys)}
  });
  const cmp=(a,b)=>gs(a.sys)-gs(b.sys)||a.m-b.m;
  meters.sort(cmp);keys.sort(cmp);
  const m0=cur.meter0||{n:4,d:4},BW=(PW-SX-RM)/MPS,sysC={};
  const at=(arr,def,s,m)=>{let r=def;for(const t of arr){const q=gs(t.sys);if(q<s||(q===s&&t.m<=m))r=t;else break}return r};
  const meterAt=(s,m)=>at(meters,m0,gs(s),m);
  const keyAt=(s,m)=>{const t=at(keys,null,gs(s),m);return t?t.n:0};
  function sysCells(s){
    if(sysC[s])return sysC[s];
    const bs=gs(s),group=pr(s),arrs=group.map(()=>[]);
    const k0=keyAt(bs,0),tsShow=bs===0||group.some(g=>cell(g,0).ts);
    let x=(tsShow?74:56)+(k0?9*Math.abs(k0)+4:0);
    for(let m=0;m<MPS;m++){
      const cs=group.map(g=>cell(g,m)),mt=meterAt(bs,m),tt=new Map();
      cs.forEach(c=>c.tt.forEach((o,k)=>{const e=tt.get(k);if(e){e.d=Math.max(e.d,o.d);e.acc=e.acc||o.acc;e.dot=e.dot||o.dot}else tt.set(k,{t:o.t,d:o.d,acc:o.acc,dot:o.dot})}));
      const cols=[...tt.values()].sort((a,b)=>a.t-b.t),cap=mt.n*4/mt.d;
      const ext=cols.reduce((a,o)=>Math.max(a,o.t+o.d),0),capEff=Math.max(cap,ext);
      const tsI=(cs.find(c=>c.ts)||{}).ts,kyI=(cs.find(c=>c.key)||{}).key;
      const lp=10+(m>0?(cs.some(c=>c.clef)?24:0)+(kyI?9*Math.abs(kyI.n)+4:0)+(tsI?28:0):0);
      const K0=(BW-lp-10)/capEff,xs=new Map();let px=-1e9,pdot=false;
      cols.forEach((o,j)=>{
        let xx=lp+o.t*K0;

  if(!rest&&stack){
    const col=mine.find(i=>i.k==='n'&&i.d===d&&Math.abs(itemX(i)-p[0])<=9);
    if(col){
      if(mine.some(i=>i.k==='n'&&i.t===col.t&&Math.abs(i.s-s)<=1)){toast('Chord notes need a gap between them');return}

  let best=null;

/* ---------- audio: synthesized piano ---------- */
function ensureAC(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function out(){ensureAC();if(!master){master=AC.createGain();master.connect(AC.destination)}return master}
function piano(m,t,len){
  const f=440*Math.pow(2,(m-69)/12),rel=AC.createGain(),lp=AC.createBiquadFilter(),end=t+Math.min(len,8)*0.92;
  lp.type='lowpass';lp.frequency.value=Math.min(12000,f*8);
  rel.gain.setValueAtTime(0.28,t);rel.gain.setValueAtTime(0.28,end);rel.gain.linearRampToValueAtTime(0.0001,end+0.2);
  rel.connect(lp);lp.connect(out());
  const dec=Math.max(0.7,3.2-m*0.03);
  [1,0.6,0.38,0.24,0.14,0.08].forEach((a,i)=>{
    const k=i+1,o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=f*k*Math.sqrt(1+0.0003*k*k);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(a,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0005,t+dec/(1+0.5*i));
    o.connect(g);g.connect(rel);o.start(t);o.stop(end+0.3);
  });
}
function ping(m){ensureAC();piano(m,AC.currentTime,0.6)}
function stopPlay(){

function playBox(){
  LY=buildLayout();
  const x0=Math.min(boxR[0],boxR[2]),x1=Math.max(boxR[0],boxR[2]),y0=Math.min(boxR[1],boxR[3]),y1=Math.max(boxR[1],boxR[3]);
  const pad=(x1-x0<8&&y1-y0<8)?16:6;
  const sel=cur.items.filter(it=>{if(it.k!=='n'&&it.k!=='r')return false;const p=pos(it);return p[0]>=x0-pad&&p[0]<=x1+pad&&p[1]>=y0-pad&&p[1]<=y1+pad});
  if(!sel.length){boxR=null;redraw();return}
  const ab=it=>LY.abs(it.sys,it.m)+it.t;
  sel.sort((a,b)=>ab(a)-ab(b));
  const a0=ab(sel[0]);
  ensureAC();
  const spb=60/Math.max(30,Math.min(300,+$('#bpm').value||100)),t0=AC.currentTime+0.08,byT=new Map();
  let end=0;const inSel=new Set(sel),skip=new Set();
  sel.forEach(i=>{
    const o=ab(i)-a0;let len=i.d;
    if(i.k==='n'&&!skip.has(i)){
      for(let c=i;c.tie;){const nx=tieNext(c);if(!nx||!inSel.has(nx))break;len+=nx.d;skip.add(nx);c=nx}   // tied notes sound as one long note
      piano(midi(i.s,i.a,i.sys,i.m),t0+o*spb,len*spb);
    }
    end=Math.max(end,o+len);
    const k=o.toFixed(3);if(!byT.has(k))byT.set(k,[]);byT.get(k).push(i);
  });
  byT.forEach((its,k)=>tms.push(setTimeout(()=>{hl=new Set(its);redraw()},+k*spb*1000)));
  tms.push(setTimeout(stopPlay,end*spb*1000+500));
}

/* ---------- pointer input ---------- */
function pt(e){
  const r=sv.getBoundingClientRect();
  return[Math.round((e.clientX-r.left+sv.scrollLeft)/Z*10)/10,Math.round((e.clientY-r.top+sv.scrollTop)/Z*10)/10,
    e.pointerType==='pen'&&e.pressure>0?Math.round(e.pressure*100)/100:0.5];
}
function hit(it,p,r){
  if(it.k==='s'||it.k==='t')return false;
  const q=pos(it);return Math.hypot(q[0]-p[0],q[1]-p[1])<r+(it.k==='c'||it.k==='m'?12:6);
}
function segD2(a,b,p){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));
  const x=a[0]+t*dx-p[0],y=a[1]+t*dy-p[1];return x*x+y*y;
}
// Cut the part of a stroke under the eraser out and keep the rest as separate strokes.
function cutStroke(s,p,r){
  const q=s.p,n=q.length,bad=new Array(n).fill(false),r2=r*r;let any=false;
  for(let i=0;i<n;i++){
    if((q[i][0]-p[0])**2+(q[i][1]-p[1])**2<r2){bad[i]=true;any=true}
    else if(i>0&&segD2(q[i-1],q[i],p)<r2){bad[i]=bad[i-1]=true;any=true}
  }
  if(!any)return null;
  const out=[];let run=[];
  for(let i=0;i<=n;i++){
    if(i<n&&!bad[i])run.push(q[i]);
    else{if(run.length>1)out.push({k:'s',c:s.c,w:s.w,p:run});run=[]}
  }
  return out;
}
function erase(p){
  LY=buildLayout();
  const r=(8+(+$('#width').value)*2)/Z,rn=14/Z;let ch=false;
  for(let i=cur.items.length-1;i>=0;i--){
    const it=cur.items[i];
    if(it.k==='s'){
      const b=box(it);if(p[0]<b[0]-r||p[0]>b[2]+r||p[1]<b[1]-r||p[1]>b[3]+r)continue;
      const pcs=cutStroke(it,p,r);if(!pcs)continue;
      cur.items.splice(i,1,...pcs);eraseOp.push({i,it,pieces:pcs});ch=true;
    }else if(hit(it,p,rn)){eraseOp.push({i,it:cur.items.splice(i,1)[0]});ch=true}
  }
  if(ch){redraw();cur.t=Date.now();saveSoon()}
}
function two(){const[a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function cancelDrag(){
  if(live){const i=cur.items.indexOf(live);if(i>=0)cur.items.splice(i,1)}

}
cv.addEventListener('pointerdown',e=>{
  if(!cur)return;

  // a second finger = pinch-zoom, never a second line
  if(ptrs.size>=2&&!(live&&live.pen)){cancelDrag();pinch={d:two().d,z:Z};pinchT=Date.now();return}
  if(drawId!==null||pinch||!['pen','eraser','box'].includes(tool))return;
  drawId=e.pointerId;cv.setPointerCapture(e.pointerId);
  const p=pt(e);
  if(tool==='pen'){live={k:'s',c:$('#color').value,w:+$('#width').value,p:[p],pen:e.pointerType==='pen'};cur.items.push(live);drawStroke(live)}
  else if(tool==='eraser'){drag='erase';eraseOp=[];erase(p)}

});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const t=two(),r=sv.getBoundingClientRect();setZoom(pinch.z*t.d/pinch.d,t.x-r.left,t.y-r.top);return}

    }

function up(e){

// Notes, rests, clefs, time signatures and text are placed with a tap

async function saveFile(name,text){
  const tries=[[name,'application/json'],[name.replace(/\.json$/,'.txt'),'text/plain']];
  for(const[n,type]of tries){
    try{
      const f=new File([text],n,{type});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return true}
    }catch(e){if(e&&e.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}

$('#mOk').onclick=()=>{$('#modal').hidden=true;if(modalFn)modalFn()};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ---------- toolbar symbols (drawn with the same canvas code as the page) ---------- */
function icon(w,h,fn){
  const c=document.createElement('canvas'),d=2;c.width=w*d;c.height=h*d;
  const real=ctx;ctx=c.getContext('2d');ctx.scale(d,d);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ctx.fillStyle='#222';
  try{fn(w,h)}finally{ctx=real}
  return c.toDataURL();
}
const noteIc=(open,stem,flags,dot,chord)=>(w,h)=>{
  const x=13,y=h-9;
  ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,stem?6.2:7.6,stem?4.4:5.2,-0.35,0,7);open?ctx.stroke():ctx.fill();
  if(chord){ctx.beginPath();ctx.ellipse(x,y-10,6.2,4.4,-0.35,0,7);ctx.fill()}
  if(stem){
    const sx=x+6;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(sx,4);ctx.stroke();
    for(let k=0;k<flags;k++){ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(sx,4+k*5);ctx.bezierCurveTo(sx+4,10+k*5,sx+10,13+k*5,sx+8,19+k*5);ctx.stroke()}
  }
  if(dot){ctx.beginPath();ctx.arc(x+(stem?12:13),y,1.9,0,7);ctx.fill()}
};
const restIc=d=>(w,h)=>{
  ctx.save();ctx.translate(w/2,h+1);ctx.scale(0.8,0.8);ctx.lineWidth=1.5;
  if(d===4||d===2){const y=d===4?-30:-20;ctx.beginPath();ctx.moveTo(-12,y);ctx.lineTo(12,y);ctx.stroke()}
  drawRest({d},0,0);ctx.restore();
};
const clefIc=(name,tx,ty)=>()=>{ctx.save();ctx.translate(tx,ty);ctx.scale(0.62,0.62);drawClef(name,0,0);ctx.restore()};
const staffIc=kind=>(w,h)=>{
  ctx.lineWidth=1.3;
  const line=(y,x2)=>{ctx.beginPath();ctx.moveTo(3,y);ctx.lineTo(x2,y);ctx.stroke()};
  const xe=kind==='plain'?w-3:23;
  if(kind==='grand'){for(let i=0;i<5;i++){line(3+i*2.8,xe);line(19+i*2.8,xe)}ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(3,3);ctx.lineTo(3,30.2);ctx.stroke()}
  else for(let i=0;i<5;i++)line(9+i*4.2,xe);
  ctx.lineWidth=2;
  if(kind==='plus'||kind==='grand'){ctx.beginPath();ctx.moveTo(29,h/2-4);ctx.lineTo(29,h/2+4);ctx.moveTo(25,h/2);ctx.lineTo(33,h/2);ctx.stroke()}
  if(kind==='x'){ctx.strokeStyle='#c62828';ctx.beginPath();ctx.moveTo(25,h/2-4);ctx.lineTo(33,h/2+4);ctx.moveTo(33,h/2-4);ctx.lineTo(25,h/2+4);ctx.stroke()}
};
const ICON={
  w:[34,30,noteIc(true,false,0,false,false)],h:[34,30,noteIc(true,true,0,false,false)],
  q:[34,30,noteIc(false,true,0,false,false)],e:[34,30,noteIc(false,true,1,false,false)],s:[34,30,noteIc(false,true,2,false,false)],
  dot:[34,30,noteIc(false,true,0,true,false)],stack:[34,30,noteIc(false,true,0,false,true)],
  rest:[34,32,restIc(1)],
  tie:[34,32,(w,h)=>{
    ctx.beginPath();ctx.ellipse(9,12,5.5,4,-0.35,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(25,12,5.5,4,-0.35,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(9,18);ctx.quadraticCurveTo(17,32,25,18);ctx.quadraticCurveTo(17,25,9,18);ctx.fill();
  }],
  cTreble:[28,44,clefIc('treble',12,36)],cBass:[28,44,clefIc('bass',10,33)],cAlto:[28,44,clefIc('alto',10,34)],cTenor:[28,44,clefIc('tenor',10,36)],
  staffPlain:[34,34,staffIc('plain')],staffPlus:[34,34,staffIc('plus')],grandPlus:[34,34,staffIc('grand')],staffX:[34,34,staffIc('x')],
  box:[34,28,(w,h)=>{
    ctx.setLineDash([4,3]);ctx.lineWidth=1.6;ctx.strokeRect(2,2,w-4,h-4);ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(13,8);ctx.lineTo(13,h-8);ctx.lineTo(25,h/2);ctx.closePath();ctx.fill();
  }]
};
function fillIcons(){
  document.querySelectorAll('[data-ico]').forEach(el=>{
    const d=ICON[el.dataset.ico];if(!d)return;
    const im=new Image(d[0],d[1]);im.alt='';im.src=icon(d[0],d[1],d[2]);el.textContent='';el.append(im);
  });
}
function tsIco(){   // the time-signature button shows the chosen signature stacked, like on the staff
  const q=$('#tsSel').value.split('/'),b=$('#tsBtn'),im=new Image(30,34);
  im.alt='';im.src=icon(30,34,(w,h)=>{ctx.font='bold 17px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(q[0],w/2,9);ctx.fillText(q[1],w/2,26)});
  b.textContent='';b.append(im);
}
function keyIco(){const n=+$('#keySel').value;$('#keyBtn').textContent=(n>0?'\u266F':n<0?'\u266D':'\u266E')+(n?Math.abs(n):'')}
fillIcons();tsIco();keyIco();

load();render();updateBk();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
