<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music Notes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Music Notes</title>
<style>
:root{color-scheme:light;--fg:#111;--mut:#888;--line:#ddd;--acc:#5b4bdb}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;font-family:-apple-system,system-ui,sans-serif;color:var(--fg);background:#fff}
#app{display:flex;height:100%}
#app.noside #side{display:none}
#side{width:220px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#f7f7f9}
#side header{padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
#list{overflow:auto;flex:1}
.item{padding:10px 12px;border-bottom:1px solid var(--line)}
.item.sel{background:#eceaff}
.item small{display:block;color:var(--mut)}
#main{flex:1;display:flex;min-width:0}
#empty{margin:auto;color:var(--mut)}
#editor{flex:1;display:flex;min-width:0;min-height:0}
#col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#head{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;font-size:20px;font-weight:700;border:0;outline:0}
button,select{font-size:13px;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#tools{width:122px;border-left:1px solid var(--line);padding:6px;overflow:auto;background:#f7f7f9}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
#bpm{width:100%;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:8px}
#scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#paper{position:relative}
#cv{position:sticky;top:0;left:0;display:block;z-index:1;-webkit-user-select:none;-webkit-touch-callout:none}
.tb{position:absolute;z-index:3;pointer-events:none;display:flex;align-items:flex-start}
#paper.tmode .tb{pointer-events:auto}
.tx{min-width:40px;max-width:640px;min-height:1.3em;padding:2px 4px;outline:0;white-space:pre-wrap;line-height:1.3;border:1px dashed transparent;-webkit-user-select:text}
#paper.tmode .tx{border-color:#bbb}
.x{display:none;padding:0 6px;font-size:14px;line-height:1.2}
#paper.tmode .x{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>Notes <button id="add">+ New</button></header>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="empty">Create a note to get started</div>
    <div id="editor" hidden>
      <div id="col">
        <div id="head"><button id="tog" title="Notes list">&#9776;</button><input id="title" placeholder="Title"></div>
        <div id="scroll"><div id="paper"><canvas id="cv"></canvas></div></div>
      </div>
      <div id="tools">
        <div class="g">
          <button data-tool="pen" class="on">Pen</button><button data-tool="eraser">Erase</button>
          <button data-tool="note">Note</button><button data-tool="rest">Rest</button>
          <button data-tool="text">Text</button><button data-tool="box">&#9654; Box</button>
          <button data-tool="hand">Hand</button><button id="stop">&#9632; Stop</button>
        </div>
        <div class="g">
          <button data-d="4">Whole</button><button data-d="2">Half</button>
          <button data-d="1" class="on">Qtr</button><button data-d="0.5">8th</button>
          <button data-d="0.25">16th</button><span></span>
          <button data-a="1">&#9839;</button><button data-a="-1">&#9837;</button>
        </div>
        <div class="g"><input type="color" id="color" value="#111111"><select id="width"><option value="2">Thin</option><option value="3" selected>Med</option><option value="6">Thick</option></select></div>
        <div class="g">
          <button id="undo">Undo</button><button id="redo">Redo</button>
          <button id="zout">&minus;</button><button id="zin">+</button>
          <button id="zlbl">100%</button><button id="addpg">+ Page</button>
          <button id="staffBtn" class="on">Staff</button><button id="del">Delete</button>
        </div>
        <input id="bpm" type="number" min="30" max="300" value="100" title="Tempo (BPM)">
      </div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),KEY='musicnotes.v1',P=140,ST=5,PITCH=[0,2,4,5,7,9,11];
let sideHidden=false;try{sideHidden=localStorage.getItem('musicnotes.side')==='1'}catch(e){}
let notes=[],cur=null,tool='pen',drag=null,live=null,timer=null,dur=1,acc=0,Z=1,drawId=null,pinch=null,pinchT=0,raf=0;
let hl=new Set(),boxR=null,AC=null,master=null,tms=[],hist=[],redoS=[],eraseOp=null;
const cv=$('#cv'),ctx=cv.getContext('2d'),sv=$('#scroll'),paper=$('#paper'),ptrs=new Map(),BB=new WeakMap(),tbs=[];
const PH=()=>(cur&&cur.h)||5000,Y0=k=>100+k*P;

/* ---------- storage ---------- */
function migrate(n){
  if(n.items)return;
  n.items=(n.strokes||[]).map(s=>({k:'s',c:s.c,w:s.w,p:s.p}));
  if(n.text&&n.text.trim())n.items.push({k:'t',x:20,y:20,t:n.text});
  ((n.score&&n.score.ev)||[]).forEach((e,i)=>{const x=70+(i%12)*55,sys=Math.floor(i/12);
    n.items.push(e.r?{k:'r',x,sys,d:e.d}:{k:'n',x,sys,s:e.s,d:e.d,a:e.a})});
  n.bpm=(n.score&&n.score.bpm)||100;delete n.strokes;delete n.text;delete n.score;
}
function load(){try{notes=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){notes=[]}notes.forEach(migrate)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){alert('Could not save: storage is full or blocked.')}}
function saveSoon(){clearTimeout(timer);timer=setTimeout(save,400)}

/* ---------- list / render ---------- */
function renderList(){
  const L=$('#list');L.textContent='';
  notes.sort((a,b)=>b.t-a.t).forEach(n=>{
    const d=document.createElement('div');d.className='item'+(cur&&cur.id===n.id?' sel':'');
    const b=document.createElement('b');b.textContent=n.title||'Untitled';
    const s=document.createElement('small');s.textContent=new Date(n.t).toLocaleDateString();
    d.append(b,s);d.onclick=()=>{cur=n;render()};L.append(d);
  });
}
function render(){
  renderList();
  $('#app').classList.toggle('noside',sideHidden&&!!cur);
  $('#editor').hidden=!cur;$('#empty').hidden=!!cur;
  if(!cur)return;
  $('#title').value=cur.title;$('#staffBtn').classList.toggle('on',cur.staff!==false);$('#bpm').value=cur.bpm||100;
  hist=[];redoS=[];stopPlay();Z=1;sv.scrollTop=0;sv.scrollLeft=0;fit();renderTexts();
}

/* ---------- items + history ---------- */
function touch(){cur.t=Date.now();renderList();saveSoon();redraw()}
function addItem(it){cur.items.push(it);hist.push({t:'a',it});redoS=[];touch()}
function delItems(list){
  const rec=[];
  list.forEach(it=>{const i=cur.items.indexOf(it);if(i>=0){cur.items.splice(i,1);rec.push({i,it})}});
  if(rec.length){hist.push({t:'d',rec});redoS=[];touch();renderTexts()}
}
function undo(){
  const o=hist.pop();if(!o)return;
  if(o.t==='a'){const i=cur.items.indexOf(o.it);if(i>=0)cur.items.splice(i,1)}
  else for(let j=o.rec.length-1;j>=0;j--)cur.items.splice(o.rec[j].i,0,o.rec[j].it);
  redoS.push(o);touch();renderTexts();
}
function redo(){
  const o=redoS.pop();if(!o)return;
  if(o.t==='a')cur.items.push(o.it);
  else o.rec.forEach(r=>{const i=cur.items.indexOf(r.it);if(i>=0)cur.items.splice(i,1)});
  hist.push(o);touch();renderTexts();
}

/* ---------- drawing engine (viewport canvas) ---------- */
function sizePaper(){
  paper.style.width=sv.clientWidth*Z+'px';paper.style.height=PH()*Z+'px';
  $('#zlbl').textContent=Math.round(Z*100)+'%';
}
function fit(){
  const d=window.devicePixelRatio||1,w=sv.clientWidth,h=sv.clientHeight;
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=w*d;cv.height=h*d;
  sizePaper();posBoxes();redraw();
}
function box(s){
  let b=BB.get(s);
  if(!b){b=[1e9,1e9,-1e9,-1e9];s.p.forEach(q=>{b[0]=Math.min(b[0],q[0]);b[1]=Math.min(b[1],q[1]);b[2]=Math.max(b[2],q[0]);b[3]=Math.max(b[3],q[1])});BB.set(s,b)}
  return b;
}
const pos=it=>[it.x,Y0(it.sys)-(it.k==='n'?it.s*ST:20)];
function redraw(){
  const d=window.devicePixelRatio||1;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(d*Z,0,0,d*Z,-sv.scrollLeft*d,-sv.scrollTop*d);
  if(!cur)return;
  const v0=sv.scrollTop/Z,v1=v0+sv.clientHeight/Z,u0=sv.scrollLeft/Z,u1=u0+sv.clientWidth/Z;
  if(cur.staff!==false)drawStaves(v0,v1);
  cur.items.forEach(it=>{
    if(it.k==='s'){if(it!==live){const b=box(it);if(b[2]<u0-20||b[0]>u1+20||b[3]<v0-20||b[1]>v1+20)return}drawStroke(it)}
    else if(it.k==='n'||it.k==='r'){const y=pos(it)[1];if(y<v0-60||y>v1+60)return;
      ctx.strokeStyle=ctx.fillStyle=hl.has(it)?'#5b4bdb':'#111';it.k==='n'?drawNote(it):drawRest(it)}
  });
  if(boxR){ctx.fillStyle='rgba(91,75,219,.12)';ctx.strokeStyle='#5b4bdb';ctx.lineWidth=1.5/Z;ctx.setLineDash([6/Z,4/Z]);
    ctx.fillRect(boxR[0],boxR[1],boxR[2]-boxR[0],boxR[3]-boxR[1]);ctx.strokeRect(boxR[0],boxR[1],boxR[2]-boxR[0],boxR[3]-boxR[1]);ctx.setLineDash([])}
}
function drawStroke(s){
  ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineCap='round';ctx.lineJoin='round';
  if(s.p.length===1){ctx.beginPath();ctx.arc(s.p[0][0],s.p[0][1],s.w*(0.4+1.2*s.p[0][2])/2,0,7);ctx.fill();return}
  for(let i=1;i<s.p.length;i++){
    const a=s.p[i-1],b=s.p[i];ctx.lineWidth=s.w*(0.4+1.2*b[2]);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  }
}

/* ---------- notation drawing ---------- */
function clef(cx,y0){
  ctx.strokeStyle='#555';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(cx,y0+8);ctx.lineTo(cx,y0-44);
  ctx.moveTo(cx,y0+8);ctx.bezierCurveTo(cx,y0+16,cx-9,y0+16,cx-8,y0+10);
  ctx.moveTo(cx,y0-44);ctx.bezierCurveTo(cx+10,y0-50,cx+12,y0-34,cx,y0-24);
  ctx.moveTo(cx,y0-24);ctx.bezierCurveTo(cx-17,y0-20,cx-14,y0+3,cx+2,y0+2);
  ctx.bezierCurveTo(cx+13,y0+1,cx+14,y0-15,cx+3,y0-15);ctx.bezierCurveTo(cx-4,y0-15,cx-4,y0-7,cx+1,y0-7);
  ctx.stroke();
}
function drawStaves(v0,v1){
  const W=sv.clientWidth,n=Math.floor(PH()/P);
  for(let k=0;k<n;k++){
    const y0=Y0(k);if(y0+40<v0||y0-90>v1)continue;
    ctx.strokeStyle='#8a8a8a';ctx.lineWidth=1;ctx.beginPath();
    for(let j=0;j<5;j++){ctx.moveTo(8,y0-j*10);ctx.lineTo(W-8,y0-j*10)}
    ctx.moveTo(8,y0);ctx.lineTo(8,y0-40);ctx.stroke();
    clef(26,y0);
    if(k===0){ctx.fillStyle='#555';ctx.font='bold 22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('4',58,y0-30);ctx.fillText('4',58,y0-10)}
  }
}
function drawRest(e){
  const x=e.x,y0=Y0(e.sys);
  if(e.d===4)ctx.fillRect(x-6,y0-30,12,5);
  else if(e.d===2)ctx.fillRect(x-6,y0-25,12,5);
  else if(e.d===1){ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x-3,y0-38);ctx.lineTo(x+3,y0-30);ctx.lineTo(x-3,y0-22);ctx.lineTo(x+3,y0-14);ctx.lineTo(x-1,y0-9);ctx.stroke()}
  else{
    ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+3,y0-30);ctx.lineTo(x-3,y0-10);ctx.stroke();
    ctx.beginPath();ctx.arc(x-3,y0-26,2.5,0,7);ctx.fill();
    if(e.d<0.5){ctx.beginPath();ctx.moveTo(x+5,y0-38);ctx.lineTo(x-1,y0-18);ctx.stroke();ctx.beginPath();ctx.arc(x-1,y0-34,2.5,0,7);ctx.fill()}
  }
}
function drawNote(e){
  const x=e.x,y0=Y0(e.sys),y=y0-e.s*ST;
  ctx.lineWidth=1.2;ctx.lineCap='round';
  for(let s=-2;s>=e.s;s-=2){const yy=y0-s*ST;ctx.beginPath();ctx.moveTo(x-11,yy);ctx.lineTo(x+11,yy);ctx.stroke()}
  for(let s=10;s<=e.s;s+=2){const yy=y0-s*ST;ctx.beginPath();ctx.moveTo(x-11,yy);ctx.lineTo(x+11,yy);ctx.stroke()}
  if(e.a){ctx.font='bold 20px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.a>0?'\u266F':'\u266D',x-15,y)}
  ctx.beginPath();ctx.ellipse(x,y,6.5,4.6,-0.35,0,7);
  if(e.d>=2){ctx.lineWidth=1.8;ctx.stroke()}else ctx.fill();
  if(e.d>=4)return;
  const up=e.s<4,sx=up?x+6:x-6,dir=up?1:-1,ty=y-dir*32;
  ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(sx,ty);ctx.stroke();
  const flags=e.d===0.5?1:e.d===0.25?2:0;
  for(let k=0;k<flags;k++){
    const o=k*6;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,ty+dir*o);
    ctx.bezierCurveTo(sx+4,ty+dir*(o+6),sx+10,ty+dir*(o+10),sx+8,ty+dir*(o+17));ctx.stroke();
  }
}

/* ---------- text boxes ---------- */
function posBox(b){b.w.style.left=b.it.x*Z+'px';b.w.style.top=b.it.y*Z+'px';b.w.firstChild.style.fontSize=16*Z+'px'}
function posBoxes(){tbs.forEach(posBox)}
function mkBox(it,fresh){
  const w=document.createElement('div');w.className='tb';
  const t=document.createElement('div');t.className='tx';t.contentEditable='true';t.textContent=it.t;
  const x=document.createElement('button');x.className='x';x.textContent='\u00D7';
  const drop=()=>{w.remove();const i=tbs.findIndex(b=>b.it===it);if(i>=0)tbs.splice(i,1)};
  t.oninput=()=>{it.t=t.innerText;if(it.t.trim()&&!cur.items.includes(it))addItem(it);else saveSoon()};
  t.onblur=()=>{if(!t.innerText.trim()){if(cur.items.includes(it))delItems([it]);else drop()}};
  x.onclick=()=>{if(cur.items.includes(it))delItems([it]);else drop()};
  w.append(t,x);paper.append(w);const b={it,w};tbs.push(b);posBox(b);
  if(fresh)t.focus();
}
function renderTexts(){
  tbs.length=0;paper.querySelectorAll('.tb').forEach(n=>n.remove());
  if(cur)cur.items.filter(i=>i.k==='t').forEach(it=>mkBox(it,false));
}

/* ---------- zoom ---------- */
function setZoom(z,cx,cy){
  z=Math.max(0.5,Math.min(4,z));
  if(cx==null){cx=sv.clientWidth/2;cy=sv.clientHeight/2}
  const ux=(sv.scrollLeft+cx)/Z,uy=(sv.scrollTop+cy)/Z;
  Z=z;sizePaper();posBoxes();
  sv.scrollLeft=ux*Z-cx;sv.scrollTop=uy*Z-cy;redraw();
}
sv.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(redraw)});

/* ---------- audio: synthesized piano ---------- */
const midi=(s,a)=>{const dn=s+30;return 12*(Math.floor(dn/7)+1)+PITCH[dn%7]+a};
function ensureAC(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function out(){ensureAC();if(!master){master=AC.createGain();master.connect(AC.destination)}return master}
function piano(m,t,len){
  const f=440*Math.pow(2,(m-69)/12),rel=AC.createGain(),lp=AC.createBiquadFilter(),end=t+Math.min(len,8)*0.92;
  lp.type='lowpass';lp.frequency.value=Math.min(12000,f*8);
  rel.gain.setValueAtTime(0.28,t);rel.gain.setValueAtTime(0.28,end);rel.gain.linearRampToValueAtTime(0.0001,end+0.2);
  rel.connect(lp);lp.connect(out());
  const dec=Math.max(0.7,3.2-m*0.03);
  [1,0.6,0.38,0.24,0.14,0.08].forEach((a,i)=>{
    const k=i+1,o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=f*k*Math.sqrt(1+0.0003*k*k);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(a,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0005,t+dec/(1+0.5*i));
    o.connect(g);g.connect(rel);o.start(t);o.stop(end+0.3);
  });
}
function ping(m){ensureAC();piano(m,AC.currentTime,0.6)}
function stopPlay(){
  tms.forEach(clearTimeout);tms=[];hl=new Set();boxR=null;
  if(master){try{master.disconnect()}catch(e){}master=null}
  if(cur)redraw();
}
function playBox(){
  const x0=Math.min(boxR[0],boxR[2]),x1=Math.max(boxR[0],boxR[2]),y0=Math.min(boxR[1],boxR[3]),y1=Math.max(boxR[1],boxR[3]);
  const pad=(x1-x0<8&&y1-y0<8)?16:6;
  const sel=cur.items.filter(it=>{if(it.k!=='n'&&it.k!=='r')return false;const p=pos(it);return p[0]>=x0-pad&&p[0]<=x1+pad&&p[1]>=y0-pad&&p[1]<=y1+pad});
  if(!sel.length){boxR=null;redraw();return}
  sel.sort((a,b)=>a.sys-b.sys||a.x-b.x);
  const groups=[];
  sel.forEach(it=>{const g=groups[groups.length-1];if(g&&g.sys===it.sys&&Math.abs(it.x-g.x)<=10)g.its.push(it);else groups.push({sys:it.sys,x:it.x,its:[it]})});
  ensureAC();
  const spb=60/Math.max(30,Math.min(300,+$('#bpm').value||100)),t0=AC.currentTime;
  let t=t0+0.08;
  groups.forEach(g=>{
    g.its.forEach(i=>{if(i.k==='n')piano(midi(i.s,i.a),t,i.d*spb)});
    tms.push(setTimeout(()=>{hl=new Set(g.its);redraw()},(t-t0)*1000));
    t+=Math.max(...g.its.map(i=>i.d))*spb;
  });
  tms.push(setTimeout(stopPlay,(t-t0)*1000+400));
}

/* ---------- pointer input ---------- */
function pt(e){
  const r=sv.getBoundingClientRect();
  return[Math.round((e.clientX-r.left+sv.scrollLeft)/Z*10)/10,Math.round((e.clientY-r.top+sv.scrollTop)/Z*10)/10,
    e.pointerType==='pen'&&e.pressure>0?Math.round(e.pressure*100)/100:0.5];
}
function hit(it,p,r){
  if(it.k==='s')return it.p.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<r);
  if(it.k==='t')return false;
  const q=pos(it);return Math.hypot(q[0]-p[0],q[1]-p[1])<r+6;
}
function erase(p){
  const r=14/Z;let n=0;
  for(let i=cur.items.length-1;i>=0;i--)if(hit(cur.items[i],p,r)){eraseOp.push({i,it:cur.items.splice(i,1)[0]});n++}
  if(n){redraw();cur.t=Date.now();saveSoon()}
}
function two(){const[a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function cancelDrag(){
  if(live){const i=cur.items.indexOf(live);if(i>=0)cur.items.splice(i,1)}
  if(eraseOp&&eraseOp.length)hist.push({t:'d',rec:eraseOp});
  live=null;drag=null;drawId=null;eraseOp=null;boxR=null;redraw();
}
cv.addEventListener('pointerdown',e=>{
  if(!cur)return;
  if(e.pointerType==='touch')ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(tool==='hand')return;
  // a second finger = pinch-zoom, never a second line
  if(ptrs.size>=2&&!(live&&live.pen)){cancelDrag();pinch={d:two().d,z:Z};pinchT=Date.now();return}
  if(drawId!==null||pinch||!['pen','eraser','box'].includes(tool))return;
  drawId=e.pointerId;cv.setPointerCapture(e.pointerId);
  const p=pt(e);
  if(tool==='pen'){live={k:'s',c:$('#color').value,w:+$('#width').value,p:[p],pen:e.pointerType==='pen'};cur.items.push(live);drawStroke(live)}
  else if(tool==='eraser'){drag='erase';eraseOp=[];erase(p)}
  else{stopPlay();drag='box';boxR=[p[0],p[1],p[0],p[1]];redraw()}
});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const t=two(),r=sv.getBoundingClientRect();setZoom(pinch.z*t.d/pinch.d,t.x-r.left,t.y-r.top);return}
  if(e.pointerId!==drawId)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  (evs.length?evs:[e]).forEach(ev=>{
    const p=pt(ev);
    if(drag==='erase')erase(p);
    else if(drag==='box'){boxR[2]=p[0];boxR[3]=p[1]}
    else if(live){
      const prev=live.p[live.p.length-1];live.p.push(p);
      ctx.strokeStyle=live.c;ctx.lineCap='round';ctx.lineWidth=live.w*(0.4+1.2*p[2]);
      ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();
    }
  });
  if(drag==='box')redraw();
});
function up(e){
  ptrs.delete(e.pointerId);
  if(pinch&&ptrs.size<2){pinch=null;pinchT=Date.now()}
  if(e.pointerId!==drawId)return;
  drawId=null;
  if(live){hist.push({t:'a',it:live});redoS=[];live=null;touch()}
  else if(drag==='erase'){if(eraseOp.length){hist.push({t:'d',rec:eraseOp});redoS=[]}eraseOp=null}
  else if(drag==='box')playBox();
  drag=null;
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
// Notes, rests and text boxes are placed with a tap (click never fires on drags or pinches)
cv.addEventListener('click',e=>{
  if(!cur||!['note','rest','text'].includes(tool)||Date.now()-pinchT<450)return;
  const p=pt(e),sys=Math.max(0,Math.min(Math.floor(PH()/P)-1,Math.round((p[1]-80)/P)));
  if(tool==='text'){mkBox({k:'t',x:p[0],y:p[1],t:''},true);return}
  if(tool==='rest'){addItem({k:'r',x:p[0],sys,d:dur});return}
  const s=Math.max(-8,Math.min(16,Math.round((Y0(sys)-p[1])/ST))),it={k:'n',x:p[0],sys,s,d:dur,a:acc};
  addItem(it);ping(midi(s,acc));
});

/* ---------- buttons ---------- */
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
  tool=b.dataset.tool;ensureAC();
  document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b));
  cv.style.touchAction=tool==='hand'?'pan-x pan-y':'none';
  paper.classList.toggle('tmode',tool==='text');
});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dur=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{acc=acc===+b.dataset.a?0:+b.dataset.a;document.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',+x.dataset.a===acc))});
$('#stop').onclick=stopPlay;
$('#add').onclick=()=>{cur={id:Date.now().toString(36),title:'',items:[],staff:true,t:Date.now(),h:5000,bpm:100};notes.unshift(cur);save();render()};
$('#title').oninput=e=>{cur.title=e.target.value;cur.t=Date.now();renderList();saveSoon()};
$('#bpm').onchange=e=>{cur.bpm=+e.target.value||100;save()};
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#zin').onclick=()=>setZoom(Z*1.25);$('#zout').onclick=()=>setZoom(Z/1.25);$('#zlbl').onclick=()=>setZoom(1);
$('#addpg').onclick=()=>{cur.h=PH()+1600;sizePaper();redraw();save()};
$('#staffBtn').onclick=()=>{cur.staff=cur.staff===false;$('#staffBtn').classList.toggle('on',cur.staff!==false);redraw();save()};
$('#del').onclick=()=>{if(confirm('Delete this note?')){notes=notes.filter(n=>n!==cur);cur=null;save();render()}};
$('#tog').onclick=()=>{sideHidden=!sideHidden;try{localStorage.setItem('musicnotes.side',sideHidden?'1':'0')}catch(e){}$('#app').classList.toggle('noside',sideHidden);fit()};
addEventListener('resize',()=>{if(cur)fit()});
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

load();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
